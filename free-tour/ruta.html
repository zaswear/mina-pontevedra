<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free Tour Digital · Miña Pontevedra</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet.js -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet" />
  
  <!-- Estilos Free Tour -->
  <link href="css/free-tour.css" rel="stylesheet" />

  <!-- Instalable: el manifiesto vive en la raíz del sitio, no en /free-tour/ -->
  <link rel="manifest" href="../manifest.webmanifest" />
  <meta name="theme-color" content="#3D6B4F" />
  <link rel="apple-touch-icon" href="../icon-192.png" />
</head>
<body class="bg-[#F7F5F0] text-slate-900 min-h-screen">

  <!-- Header Sticky con Progreso y Botón para Volver a la Web Principal -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 px-4 py-2.5 space-y-2">
    <div class="max-w-2xl mx-auto flex items-center justify-between gap-2">
      <!-- Botones de Navegación -->
      <div class="flex items-center gap-2">
        <a href="../index.html" class="flex items-center gap-1.5 px-3 py-1 bg-emerald-800 hover:bg-emerald-900 text-white text-xs font-bold rounded-full transition-colors shadow-sm">
          <span>🏠</span>
          <span>Web Principal</span>
        </a>
        <a href="index.html" class="hidden sm:flex items-center gap-1 text-xs font-semibold text-slate-500 hover:text-slate-800">
          <span>❮ Cambiar Ruta</span>
        </a>
      </div>

      <div class="flex items-center gap-2">
        <span id="ft-header-title" class="text-xs font-bold text-slate-800 truncate max-w-[140px] sm:max-w-none">Free Tour</span>
        <span id="ft-progress-text" class="text-[11px] font-mono font-bold px-2 py-0.5 bg-emerald-100 text-emerald-800 rounded-full">Parada 1</span>
      </div>
    </div>

    <!-- Barra de progreso -->
    <div class="progress-bar-container max-w-2xl mx-auto">
      <div id="ft-progress-fill" class="progress-bar-fill" style="width: 15%;"></div>
    </div>
  </header>

  <!-- Mapa Interactivo Plegable -->
  <div class="max-w-2xl mx-auto px-4 pt-4">
    <div id="ft-map" class="h-44 w-full rounded-2xl shadow-sm border border-slate-200"></div>
  </div>

  <!-- Contenedor Principal de Paradas -->
  <main id="ft-content" class="max-w-2xl mx-auto px-4 py-4">
    <!-- Carga dinámica por JS -->
  </main>

  <!-- Footer con enlace persistente de retorno -->
  <footer class="max-w-2xl mx-auto px-4 py-6 text-center text-xs text-slate-500 border-t border-slate-200 my-6">
    <a href="../index.html" class="inline-flex items-center gap-2 px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold rounded-full transition-colors">
      <span>🏠</span>
      <span>Volver a Miña Pontevedra (Web Principal)</span>
    </a>
  </footer>

  <!-- Scripts del Free Tour -->
  <script src="js/speech.js"></script>
  <script src="js/geolocation.js"></script>
  <script src="js/map.js"></script>
  <script src="js/free-tour.js"></script>

  <script>
    // También aquí, no solo en index.html: esta es la página que se abre
    // caminando, y quien llega directo a una ruta se quedaba sin modo offline.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
